# Scheduled crawl → SQLite import → static dataset → GitHub Pages.
#
# Design notes (see docs/adr/0006-state-publication-on-pages.md):
# - Exactly one writer at a time: the `pages-publish` concurrency group never
#   cancels a running publication; later runs queue behind it.
# - The previous finalized state is downloaded from Pages and verified inside
#   the pipeline. When it cannot be obtained the run fails instead of
#   silently resetting the history. `bootstrap=true` is the only way to start
#   from nothing and is refused once a state exists.
# - Collection is parallel, import is serial. The stores are independent hosts,
#   so each observed store is crawled in its own `collect` job (one matrix
#   entry per store, so the run takes as long as the slowest store, not the
#   sum), which uploads its raw snapshot and a record of the collection. The
#   crawl is the only slow part and touches no shared state. One `publish` job
#   then imports those snapshots one after another: every store shares one
#   history and one `state/` directory, so the first reads the published state
#   and each later one continues from what the previous store just finalized.
#   Importing in parallel would make each finalize discard the other's run.
#   Per-store load (pacing, request count) is the same as when one job ran
#   every crawl in series; only the waiting between stores is gone.
# - The deployment replaces the whole site, so a store that produced nothing
#   this run would be removed from Pages. Any store the history knows but the
#   site is missing is republished from that history before the gate, and the
#   gate refuses to deploy a site that is still missing one.
# - Deployment happens only when the site is complete, and always as one Pages
#   artifact (data + state + userscript), so readers never see a half-written
#   dataset.
# - Exit codes of the import: 0 published/unchanged, 3 quarantined (still
#   publishable, the rejection is recorded in the state), anything else failed
#   (that store observed nothing). A collection that ended incomplete is not a
#   failed collect job: its snapshot and record are uploaded, and the import
#   quarantines it with the collector's errors in the report.
# - A store that was not observed (quarantined or failed) raises an Issue in a
#   separate `alerts` job, and the Issue closes itself when a later run
#   observes the store again. The write token lives only in that job.
name: Crawl and publish

on:
  schedule:
    # Wake daily at 05:00 JST and observe every store whose cadence is daily.
    # Store selection comes from observation.cadence, not store names here.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      stores:
        description: 'Stores to observe, space separated (empty = all). The rest keep their published dataset.'
        type: string
        default: ''
      bootstrap:
        description: 'Start a NEW history (only allowed when no state is published yet; set `stores` to one store)'
        type: boolean
        default: false
      dry_run:
        description: 'Run the pipeline and upload artifacts, but do not deploy to Pages'
        type: boolean
        default: false
      snapshot_retention_days:
        description: 'Retention (days) of the raw snapshot artifact'
        type: number
        default: 90
      reimport_snapshot_from_run:
        description: 'Run id whose raw snapshot to re-import instead of crawling (set `stores` to one store)'
        type: string
        default: ''
      republish:
        description: 'Rebuild and deploy the site from the published history: no crawl, no import, no new observation'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pages-publish
  cancel-in-progress: false

env:
  # Every store the site publishes, in import order. Adding one means adding
  # `config/<store>.json`, a collector and an adapter; the collect matrix and
  # the snapshot artifacts follow from the stores a run observes.
  STORES: akizuki switch-science m5stack ksy sengoku pimoroni
  # The daily wake-up: the stores that declare cadence "daily" are observed by it.
  DAILY_CRON: '0 20 * * *'
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  # Decides which stores this run observes and hands the collect job its matrix.
  plan:
    name: Plan the crawl
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      observe: ${{ steps.observed.outputs.observe }}
      matrix: ${{ steps.observed.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Select the observed stores
        id: observed
        env:
          OBSERVE: ${{ inputs.stores }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          REPUBLISH: ${{ inputs.republish }}
          REIMPORT: ${{ inputs.reimport_snapshot_from_run }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
        run: |
          set -uo pipefail
          # Which stores this run observes comes from each store's
          # observation.cadence, never from store names here: a schedule takes
          # the stores that declare its cadence, a manual run with no stores
          # takes every store still observed, and a stopped store is never
          # observed. Unknown or stopped stores named in `stores` are an error.
          if ! observe=$(node --import tsx scripts/observed-stores.ts); then exit 1; fi
          echo "::notice title=Observed stores::${EVENT_NAME:-} ${EVENT_CRON:-} observes: ${observe:-none}"
          if [ "${BOOTSTRAP:-false}" = "true" ] && [ "$(echo $observe | wc -w)" != "1" ]; then
            echo "::error::bootstrap starts one store's history; set 'stores' to exactly one store"
            exit 1
          fi
          # A re-import crawls nothing: the snapshot comes from an earlier run.
          if [ -n "${REIMPORT:-}" ]; then
            matrix='[]'
          else
            matrix=$(jq -cn --arg stores "$observe" '$stores | split(" ") | map(select(. != ""))')
          fi
          echo "observe=$observe" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # One job per observed store: the shops are independent hosts, so their
  # crawls overlap. Nothing here touches the shared history or the site.
  collect:
    name: Collect ${{ matrix.store }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      # One store failing or running long must not cancel the others.
      fail-fast: false
      matrix:
        store: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Note when the job started
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      # What a collector learned in its last full run (ADR-0032). It is a cache
      # in the strict sense. Losing it (evicted after 7 days without a run, a
      # manual run on another branch) only makes the next run read everything,
      # as it did before. Stores that keep nothing simply find no cache.
      - name: Restore what the collector carries between runs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/work/carry
          key: ${{ matrix.store }}-cover-${{ github.run_id }}
          restore-keys: ${{ matrix.store }}-cover-

      - name: Crawl
        env:
          STORE: ${{ matrix.store }}
        run: |
          set -uo pipefail
          # The same `set +e` as the import loop: with pipefail on, a nonzero
          # crawl would end the step at the pipe before the exit code is read.
          set +e
          node --import tsx src/cli/main.ts crawl --config "config/$STORE.json" 2>&1 | tee "collect-$STORE.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "$STORE: crawl exit code $code"
          case "$code" in
            0) ;;
            # Incomplete: the snapshot and the record are written, and the
            # import quarantines it with the collector's errors in its report.
            2) echo "::warning title=$STORE incomplete::The collection ended incomplete; the import will quarantine it." ;;
            *)
              echo "::error title=$STORE failed::The crawl failed (exit $code) and left no snapshot; see this job's log."
              exit 1
              ;;
          esac

      # Written by a complete full run only; a cover run leaves the file as it
      # found it, so its age keeps counting from that full run.
      - name: Save what the collector carries between runs
        if: always() && hashFiles('state/work/carry/*') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/work/carry
          key: ${{ matrix.store }}-cover-${{ github.run_id }}-${{ github.run_attempt }}

      # One artifact per store: a snapshot is the input a re-import needs, and
      # they are large enough that fetching one should not drag the others along.
      # The name is what the re-import step of the publish job looks for.
      - name: Upload raw snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-${{ matrix.store }}-${{ github.run_id }}
          path: snapshots/${{ matrix.store }}-*
          # Longer than the crawl interval, so two consecutive snapshots can
          # always be compared when a run needs explaining (ADR-0013).
          retention-days: ${{ inputs.snapshot_retention_days || 90 }}
          if-no-files-found: ignore

      # What the collection reported, for the import job's report.
      - name: Upload the collect record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collect-${{ matrix.store }}-${{ github.run_id }}
          path: reports/collect-${{ matrix.store }}.json
          retention-days: 90
          if-no-files-found: ignore

      # Measured after the uploads, so it covers nearly the whole job.
      # JOB_LIMIT_MINUTES must equal this job's timeout-minutes (a test pins it).
      # A job that failed before the checkout has no script to run: the step is
      # skipped rather than adding a second error that hides the first (#110).
      - name: Run length against the limit
        if: always() && hashFiles('scripts/run-budget.ts') != ''
        env:
          JOB_LIMIT_MINUTES: 150
        run: node scripts/run-budget.ts

  publish:
    name: Import and generate
    needs: [plan, collect]
    # `always()`: a store whose collect job failed must not keep the others
    # from being imported; it is reported as failed and republished from history.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Only to read a previous run's snapshot artifact when re-importing.
      actions: read
    outputs:
      publishable: ${{ steps.gate.outputs.publishable }}
      dataset_versions: ${{ steps.gate.outputs.dataset_versions }}
      failed_stores: ${{ steps.pipeline.outputs.failed_stores }}
    steps:
      - name: Note when the job started
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      # A fix in the import/generate stages must not cost another full crawl of
      # a store (the largest is thousands of requests). Re-importing the
      # snapshot a previous run already collected reproduces everything
      # downstream of `collect`. `republish` goes further and skips the import
      # too: use it when only the site changed (userscript bundle, landing
      # page), so the deployment does not fabricate an observation.
      - name: Download the snapshot to re-import
        id: reimport
        if: inputs.reimport_snapshot_from_run != '' && inputs.republish != true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.reimport_snapshot_from_run }}
          OBSERVE: ${{ inputs.stores }}
        run: |
          set -euo pipefail
          case "${OBSERVE:-}" in
            '' | *' '*) echo "::error::set 'stores' to exactly one store when re-importing a snapshot"; exit 1 ;;
          esac
          mkdir -p snapshots
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "snapshot-$OBSERVE-$RUN_ID" --dir snapshots
          file=$(find snapshots -type f -name "$OBSERVE-*.json*" | sort | tail -1)
          if [ -z "$file" ]; then echo "::error::no $OBSERVE snapshot in run $RUN_ID"; exit 1; fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "::notice title=Re-importing::$file (from run $RUN_ID; no crawl)"

      # The snapshots and records of this run's collect jobs. When no collect
      # job ran (a republish, a re-import) or none uploaded, nothing matches
      # and the import step below finds no file for a store.
      - name: Download this run's snapshots
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: snapshot-*-${{ github.run_id }}
          merge-multiple: true
          path: snapshots

      - name: Download this run's collect records
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: collect-*-${{ github.run_id }}
          merge-multiple: true
          path: collected

      - name: Run the pipeline for every store
        id: pipeline
        env:
          OBSERVE: ${{ needs.plan.outputs.observe }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          SNAPSHOT_FILE: ${{ steps.reimport.outputs.file }}
        run: |
          set -uo pipefail
          failed=""
          # The downloads above create these only when an artifact matched. With
          # no snapshot in the whole run, `find` on a missing directory exits 1,
          # and under `bash -e` with pipefail that ended the step at the
          # assignment instead of marking the store as failed (#110).
          mkdir -p snapshots collected
          for store in $STORES; do
            config="config/$store.json"
            if [ ! -f "$config" ]; then echo "::error::no config for store $store ($config)"; exit 1; fi
            flags=""
            case " $OBSERVE " in
              *" $store "*)
                # A re-import names its snapshot; otherwise the store's collect
                # job uploaded one, and the newest is the one to import.
                if [ -n "${SNAPSHOT_FILE:-}" ]; then
                  file="$SNAPSHOT_FILE"
                else
                  file=$(find snapshots -type f -name "$store-*.json*" | sort | tail -1)
                fi
                if [ -z "$file" ]; then
                  failed="$failed $store"
                  echo "::error title=$store failed::The collect job produced no snapshot; see its log."
                  continue
                fi
                if [ "${BOOTSTRAP:-false}" = "true" ]; then flags="$flags --bootstrap"; fi
                flags="$flags --snapshot $file"
                record=$(find collected -type f -name "collect-$store.json" | sort | tail -1)
                if [ -n "$record" ]; then flags="$flags --collect-record $record"; fi
                ;;
              # Not observed this run: regenerate its dataset from the published
              # history so the deployment does not remove it from Pages.
              *) flags="--republish" ;;
            esac
            # The stores share one history. The first run reads the published
            # state named in its config; every later one continues from the
            # state the previous store just finalized, or its run would be lost.
            if [ -f site/state/state.json ]; then flags="$flags --previous-dir site/state"; fi

            echo "::group::pipeline $store ${flags# }"
            # tee so the job log shows the run even when the artifact is not read.
            # The step's shell is `bash -e` and pipefail is on, so without +e a
            # store exiting 3 (quarantined) or 1 (failed) ended the loop here,
            # and with it every later store and the deployment (#78).
            set +e
            # shellcheck disable=SC2086
            node --import tsx src/cli/main.ts pipeline --config "$config" $flags 2>&1 | tee "pipeline-$store.md"
            code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            echo "$store: pipeline exit code $code"
            # Anything but 0 and 3 failed, not only 1: an abnormal exit (out of
            # memory, a signal) observed nothing either and must not pass as success.
            if [ "$code" != "0" ] && [ "$code" != "3" ]; then
              failed="$failed $store"
              echo "::error title=$store failed::The store observed nothing this run; see the job summary for the failing stage."
              # Keep the failing report: the repair step below overwrites it.
              cp "reports/pipeline-$store.json" "reports/pipeline-$store.failed-run.json" 2>/dev/null || true
            fi
          done
          echo "failed_stores=${failed# }" >> "$GITHUB_OUTPUT"

      # A store that failed before it wrote anything leaves no dataset in the
      # site, and the deployment replaces the site wholesale — so publishing as
      # it stands would delete that store from Pages. Its history is untouched,
      # so republishing puts back exactly what is already published: same
      # dataset version, no new observation, no change to the run count.
      - name: Restore stores the site is missing
        if: always() && hashFiles('site/state/state.json') != ''
        run: |
          set -euo pipefail
          for store in $(jq -r '.stores | to_entries[] | select(.value.runCount > 0) | .key' site/state/state.json); do
            if [ -f "site/data/v1/stores/$store/manifest.json" ] \
              && node --import tsx src/cli/main.ts verify --config "config/$store.json" --site site >/dev/null; then
              continue
            fi
            echo "::warning title=$store restored::Republishing its missing or state-mismatched dataset from the published history."
            node --import tsx src/cli/main.ts pipeline --config "config/$store.json" --republish --previous-dir site/state 2>&1 | tee -a "pipeline-$store.md"
          done

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          for report in reports/pipeline-*.json; do
            [ -f "$report" ] || continue
            node --import tsx src/cli/main.ts summary --report "$report" --append-to "$GITHUB_STEP_SUMMARY"
            if [ "$(jq -r '.outcome' "$report")" = "quarantined" ]; then
              echo "::warning title=Snapshot quarantined::$(jq -r '.storeId' "$report"): the crawl was rejected by the sanity checks; history unchanged."
            fi
          done

      - name: Build userscript, Chrome extension and static pages into site/
        if: hashFiles('site/state/state.json') != ''
        run: |
          node --import tsx scripts/build-userscript.ts --out site
          # The extension ships as the zip only: it is installed from disk, so
          # the unpacked tree on Pages would just be a second copy of the bundle.
          node --import tsx scripts/build-extension.ts --out "$RUNNER_TEMP/extension" --zip site/electronics-price-history-extension.zip
          cp -R public/. site/
          touch site/.nojekyll

      # Fail-closed gate: the site is deployable only when every store the
      # history knows about is in it, and every dataset in it verifies against
      # the published contract.
      - name: Check the site is complete
        id: gate
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f site/state/state.json ]; then
            echo "::warning::no finalized state was produced; nothing to deploy"
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ok=true
          for store in $(jq -r '.stores | to_entries[] | select(.value.runCount > 0) | .key' site/state/state.json); do
            if [ ! -f "config/$store.json" ]; then
              echo "::error::the published history contains store '$store' but the repository has no config/$store.json"
              ok=false
              continue
            fi
            if [ ! -f "site/data/v1/stores/$store/manifest.json" ]; then
              echo "::error::store '$store' has runs in the state but no dataset in site/; refusing to deploy a site that would remove it"
              ok=false
              continue
            fi
            if ! node --import tsx src/cli/main.ts verify --config "config/$store.json" --site site; then
              echo "::error::store '$store' failed dataset verification"
              ok=false
            fi
          done
          versions=$(jq -c -n '[inputs | {(.storeId): .datasetVersion}] | add' site/data/v1/stores/*/manifest.json)
          echo "publishable=$ok" >> "$GITHUB_OUTPUT"
          echo "dataset_versions=$versions" >> "$GITHUB_OUTPUT"
          {
            echo "### Site"
            echo '```'
            du -sh site site/data site/state
            echo "files: $(find site -type f | wc -l)"
            echo "datasets: $versions"
            echo "publishable: $ok"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ github.run_id }}
          path: |
            reports/
            pipeline-*.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload finalized state (backup)
        if: always() && hashFiles('site/state/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: state-${{ github.run_id }}
          path: site/state/
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: steps.gate.outputs.publishable == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
          retention-days: 7

      # Measured after the uploads, so it covers nearly the whole job.
      # JOB_LIMIT_MINUTES must equal this job's timeout-minutes (a test pins it).
      # A job that failed before the checkout has no script to run: the step is
      # skipped rather than adding a second error that hides the first (#110).
      - name: Run length against the limit
        if: always() && hashFiles('scripts/run-budget.ts') != ''
        env:
          JOB_LIMIT_MINUTES: 60
        run: node scripts/run-budget.ts

      # Last, so the artifacts of a failed store are always uploaded. The other
      # stores were still published; this marks the run for a human to look at.
      - name: Fail the job when a store failed
        if: steps.pipeline.outputs.failed_stores != ''
        env:
          FAILED_STORES: ${{ steps.pipeline.outputs.failed_stores }}
        run: |
          echo "stores that observed nothing: $FAILED_STORES"
          exit 1

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    # `always()`: one store failing must not keep the stores that did run off
    # Pages. The gate has already refused any site that is missing a store.
    if: always() && needs.publish.outputs.publishable == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify the published manifests
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          VERSIONS: ${{ needs.publish.outputs.dataset_versions }}
        run: |
          set -uo pipefail
          for store in $(echo "$VERSIONS" | jq -r 'keys[]'); do
            expected=$(echo "$VERSIONS" | jq -r --arg s "$store" '.[$s]')
            url="${PAGE_URL%/}/data/v1/stores/$store/manifest.json?v=$expected"
            served=""
            for i in 1 2 3 4 5 6; do
              got=$(curl -fsSL --max-time 30 "$url" | jq -r '.datasetVersion' 2>/dev/null || true)
              if [ "$got" = "$expected" ]; then served=yes; echo "$store: published datasetVersion $got"; break; fi
              echo "$store attempt $i: got '$got', expected '$expected'; waiting for the CDN"
              sleep 20
            done
            if [ -z "$served" ]; then
              echo "::warning::Pages did not serve $store datasetVersion $expected within 2 minutes (CDN propagation?)"
            fi
          done

  # Separate from `publish` on purpose: that job runs npm dependencies and
  # parses store pages, so it must not hold a token that can write. The write
  # permission lives here, in a job that installs nothing and runs one
  # dependency-free script over the uploaded reports.
  alerts:
    name: Raise or clear crawl alerts
    needs: publish
    # A dry run publishes nothing, so it neither raises nor clears an alert.
    if: always() && needs.publish.result != 'skipped' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Missing when the publish job was cancelled before it uploaded anything;
      # the script then has nothing to do, and the red job is the notice.
      - name: Download the reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reports-${{ github.run_id }}
          path: alerts-in
      - name: Raise or clear the alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED_STORES: ${{ needs.publish.outputs.failed_stores }}
          ALERT_ASSIGNEE: ${{ github.repository_owner }}
        run: node scripts/crawl-alerts.ts --reports alerts-in
